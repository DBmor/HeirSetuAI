<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — JobPlatform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B2B;
    --brand-900:#12324F;
    --brand-700:#1F4E79;
    --brand-500:#2E86AB;
    --brand-100:#EAF2F8;
    --amber-500:#F0A93B;
    --paper:#F7F9FB;
    --line:#E2E8EE;
    --muted:#5B6B7C;
    --muted-2:#8697A8;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);
    background:var(--paper);
    margin:0;
    min-height:100vh;
  }
  .font-display{font-family:'Sora',sans-serif;}

  .layout{
    min-height:100vh;
    display:grid;
    grid-template-columns:5fr 7fr;
  }
  /* ---- left brand panel ---- */
  .brand-panel{
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:48px;
    color:#fff;
    background:linear-gradient(155deg, var(--brand-900), var(--brand-700) 60%, var(--brand-500));
  }
  .hero-shape{position:absolute;border-radius:9999px;}
  .shape-1{width:340px;height:340px;background:#fff;opacity:.12;top:-120px;left:-100px;}
  .shape-2{width:220px;height:220px;background:var(--amber-500);opacity:.28;bottom:-60px;right:-60px;}
  .brand-logo{position:relative;z-index:2;font-weight:800;font-size:24px;letter-spacing:-0.02em;}
  .brand-copy{position:relative;z-index:2;max-width:360px;}
  .brand-headline{font-weight:700;font-size:34px;line-height:1.15;margin:0 0 16px;}
  .brand-sub{color:rgba(255,255,255,.8);font-size:15px;line-height:1.6;margin:0;}
  .brand-tags{position:relative;z-index:2;display:flex;gap:16px;flex-wrap:wrap;color:rgba(255,255,255,.7);font-size:13px;}
  .brand-tags span{display:inline-flex;align-items:center;gap:8px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--amber-500);display:inline-block;}

  /* ---- right form panel ---- */
  .form-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;}
  .form-wrap{width:100%;max-width:420px;}
  .mobile-brand{display:none;text-align:center;margin-bottom:32px;font-weight:800;font-size:20px;color:var(--brand-700);}
  @media (max-width:980px){.mobile-brand{display:block;}}

  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .mode-tab{
    background:none;border:none;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:14px;padding:0 0 10px;color:var(--muted-2);
    border-bottom:2px solid transparent;
  }
  .mode-tab.active{color:var(--brand-900);border-color:var(--amber-500);}

  .role-label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;}
  .role-toggle{
    position:relative;display:grid;grid-template-columns:1fr 1fr;
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:28px;
  }
  .role-toggle button{
    position:relative;z-index:2;background:none;border:none;cursor:pointer;font-family:inherit;
    padding:10px 0;font-weight:600;font-size:14px;border-radius:999px;color:var(--muted);
  }
  .role-toggle button.active{color:#fff;}
  .role-thumb{
    position:absolute;top:4px;left:4px;height:calc(100% - 8px);width:calc(50% - 4px);
    background:var(--brand-700);border-radius:999px;
    transition:transform .28s cubic-bezier(.65,0,.35,1);z-index:1;
  }
  .role-thumb.company{transform:translateX(100%);}

  form{display:flex;flex-direction:column;gap:16px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group.hidden{display:none;}
  label{font-size:13px;font-weight:600;}
  .field{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
    font-size:14px;background:#fff;font-family:inherit;
  }
  .field:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(46,134,171,.15);}

  .form-error{display:none;font-size:13px;color:#DC2626;font-weight:500;margin:0;}
  .form-error.show{display:block;}

  .btn-primary{
    background:var(--brand-700);color:#fff;font-weight:600;border:none;border-radius:10px;
    padding:13px 0;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .btn-primary:hover{background:var(--brand-900);}
  .btn-primary:disabled{opacity:.6;cursor:default;}

  .divider{display:flex;align-items:center;gap:12px;margin:24px 0;}
  .divider .line{height:1px;flex:1;background:var(--line);}
  .divider span{font-size:12px;color:var(--muted-2);font-weight:500;}

  .btn-google{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 0;
    font-weight:600;font-size:14px;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-google:hover{border-color:#C6D2DD;background:#FBFCFD;}

  .switch-line{text-align:center;font-size:13px;color:var(--muted);margin-top:32px;}
  .switch-line button{
    background:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;
    color:var(--brand-700);text-decoration:underline;font-size:13px;padding:0;
  }

  /* mobile: hide brand panel, stack form full-width — placed last so it wins the cascade */
  @media (max-width: 980px){
    .layout{grid-template-columns:1fr;}
    .brand-panel{display:none;}
  }
</style>
</head>
<body>

<div class="layout">

  <!-- LEFT: brand panel -->
  <div class="brand-panel">
    <div class="hero-shape shape-1"></div>
    <div class="hero-shape shape-2"></div>

    <div class="brand-logo font-display">JobPlatform</div>

    <div class="brand-copy">
      <p class="brand-headline font-display">Where the right<br/>match finds you.</p>
      <p class="brand-sub">Upload your resume once. Our screening agent reads every job description for you and tells you exactly how well you fit — and what to fix if you don't.</p>
    </div>

    <div class="brand-tags">
      <span><span class="dot"></span>AI resume matching</span>
      <span><span class="dot"></span>Verified companies only</span>
    </div>
  </div>

  <!-- RIGHT: form panel -->
  <div class="form-panel">
    <div class="form-wrap">

      <div class="mobile-brand font-display">JobPlatform</div>

      <div class="tabs">
        <button type="button" class="mode-tab active" data-mode="login" onclick="setMode('login')">Log in</button>
        <button type="button" class="mode-tab" data-mode="register" onclick="setMode('register')">Create account</button>
      </div>

      <div>
        <p class="role-label">I am a</p>
        <div class="role-toggle">
          <div class="role-thumb" id="roleThumb"></div>
          <button type="button" class="active" id="roleCandidateBtn" onclick="setRole('candidate')">Candidate</button>
          <button type="button" id="roleCompanyBtn" onclick="setRole('company')">Company</button>
        </div>
      </div>

      <form id="authForm" novalidate>

        <div class="form-group hidden" id="nameField">
          <label id="nameLabel">Full name</label>
          <input type="text" name="name" class="field" id="nameInput" placeholder="e.g. Bhavika Dhamecha" />
        </div>

        <div class="form-group hidden" id="websiteField">
          <label>Company website</label>
          <input type="url" name="website" class="field" placeholder="https://yourcompany.com" />
        </div>

        <div class="form-group">
          <label id="emailLabel">Email</label>
          <input type="email" name="email" class="field" id="emailInput" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" class="field" placeholder="••••••••" required minlength="8" />
        </div>

        <p id="formError" class="form-error"></p>

        <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
      </form>

      <div class="divider"><span class="line"></span><span>or</span><span class="line"></span></div>

      <button type="button" class="btn-google" onclick="continueWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.16.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.98 8.98 0 0 0 9 0 9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        <span id="googleLabel">Continue with Google</span>
      </button>

      <p class="switch-line">
        Hiring, not job-hunting?
        <button type="button" onclick="setRole('company')">Register as a company</button>
      </p>
    </div>
  </div>
</div>

<script src="/static/js/auth.js"></script>
</body>
</html>
